<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A fast, spreadsheet-managed launcher for frequently used web applications.">
    <title>My Homepage</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <div class="state-message" id="statusMessage" role="status">Loading your links…</div>
      <section class="tile-grid" id="tileGrid" aria-label="Frequently used web applications"></section>

      <div class="usage-tools">
        <aside class="usage-panel" id="usagePanel" aria-labelledby="usageTitle" hidden>
          <div class="usage-panel-header">
            <h2 id="usageTitle">Click counts</h2>
            <button class="close-button" id="closeUsage" type="button" aria-label="Close click counts">×</button>
          </div>
          <div class="usage-list" id="usageList"></div>
          <button class="reset-all-button" id="resetAll" type="button" disabled>Reset all counts</button>
        </aside>

        <button
          class="usage-toggle"
          id="usageToggle"
          type="button"
          aria-label="View click counts"
          aria-expanded="false"
          aria-controls="usagePanel"
        ><span aria-hidden="true">⚙</span></button>
      </div>
    </main>
  </body>
</html>
